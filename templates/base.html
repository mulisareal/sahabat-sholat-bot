<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SahabatSholat{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="--primary: {% block color %}#059669{% endblock %};">
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="brand">🕌 SahabatSholat</a>
        {% block header_extra %}{% endblock %}
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">SahabatSholat &middot; Praktikum Aplikasi Web Flask</footer>
    {% block scripts %}{% endblock %}
</body>
</html>
